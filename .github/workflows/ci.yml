name: Smartkeeda CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests
        run: mvn clean test -Dbrowser=chrome -Dcucumber.filter.tags="@login"
        env:
          CI: true # Triggers headless mode in Hooks.java

      - name: Upload Test Reports & Screenshots
        uses: actions/upload-artifact@v4
        if: always() # Upload even if tests fail
        with:
          name: test-results
          path: |
            target/cucumber-reports/
            target/surefire-reports/
          retention-days: 7